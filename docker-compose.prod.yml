# TVZ production compose — lives on this repo's `production` branch and
# intentionally diverges from upstream's docker-compose.prod.yml (which
# bundles its own postgres/redis/traefik for a single-box self-host). This
# fork's `main`/`latest`/`stable` branches track upstream unmodified;
# `production` is the only branch meant to be deployed by TVZ, and carries
# TVZ-only source patches on top of upstream releases (see git log) plus
# this compose override.
#
# Deployed as a Coolify Service (docker_compose_raw) on the TVZ Coolify
# host — built images pushed to ECR
# (418837801842.dkr.ecr.eu-north-1.amazonaws.com/freeframe/{api,web}),
# since the Coolify host is only authenticated against that registry (see
# ../../cool-api/../firecrawl/lessons.md "Private registry (ECR)" — from
# the private-server-setup ops repo, not this one).
#
# Image tags: `production-<short-sha>`, the short sha of the `production`
# commit the image was built from (`git rev-parse --short HEAD`) — traceable
# 1:1 back to exact source, unlike the earlier `stable-d5611f9-patchN` scheme
# (kept only for the images built before this branch existed). Rebuild after
# any change here or under apps/api, apps/web, or packages/transcoder; update
# all five `image:` tags below to the new sha together.
#
# Changes vs upstream docker-compose.prod.yml:
#   - Removed bundled `postgres` service + `pgdata` volume — uses the shared
#     Coolify Postgres instance (schema `freeframe`, role `freeframe_app`)
#     instead. See cool-api/scripts/create-postgres-schema.sh in the ops repo.
#   - Removed bundled `redis` service + `redisdata` volume — uses the shared
#     standalone Dragonfly instance instead (DB index 1, convention-only
#     isolation, no per-service ACL — see cool-api/resolver.md §11
#     "Shared Dragonfly" and cool-api/dragonfly-db-registry.md in the ops repo).
#   - Removed bundled `traefik` entirely (and all its labels). Coolify's own
#     Traefik only routes on exact Host-header match, which isn't needed here —
#     domain differentiation happens at the external Caddy box instead (its own
#     site blocks per domain). These containers are exposed on fixed host ports
#     (18080/18081) and respond regardless of Host header; Caddy decides which
#     domain maps to which port and does the real public TLS termination.
#   - `web` and `api` are on separate subdomains (freeframe.mkt.techvzero.com /
#     api.freeframe.mkt.techvzero.com) — the `web` image is built with
#     NEXT_PUBLIC_API_URL baked to the full api subdomain.
#
# This file is the source of truth for what SHOULD be deployed. After any
# edit here, push the redeploy through Coolify's API (PATCH
# /services/{uuid} with this content, then restart) so the live
# docker_compose_raw matches — see cool-api/resolver.md in the ops repo.
x-api-env: &api-env
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  JWT_SECRET: ${JWT_SECRET}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
  S3_STORAGE: ${S3_STORAGE}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_REGION: ${S3_REGION}
  S3_ENDPOINT: ${S3_ENDPOINT}
  FRONTEND_URL: ${FRONTEND_URL}
  CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
  MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-FreeFrame}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
  TRANSCODER_ENGINE: ${TRANSCODER_ENGINE:-ffmpeg}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-0}
  SOFT_DELETE_RETENTION_DAYS: ${SOFT_DELETE_RETENTION_DAYS:-30}
  ORPHAN_SWEEP_GRACE_HOURS: ${ORPHAN_SWEEP_GRACE_HOURS:-0}
  ORPHAN_SWEEP_DELETE: ${ORPHAN_SWEEP_DELETE:-false}
  TRANSCODE_QUALITIES: ${TRANSCODE_QUALITIES:-1080p,720p,360p}

services:
  api:
    image: 418837801842.dkr.ecr.eu-north-1.amazonaws.com/freeframe/api:production-a510f3a
    environment:
      <<: *api-env
      DISABLE_DOCS: "true"
    ports:
      - "18080:8000"
    networks:
      - default
      - shared-postgres
    command: >
      sh -c "cd /workspace/apps/api && alembic upgrade head && cd /workspace &&
      gunicorn apps.api.main:app
      -w ${API_WORKERS:-4}
      -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --timeout 120
      --graceful-timeout 30"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  worker:
    image: 418837801842.dkr.ecr.eu-north-1.amazonaws.com/freeframe/api:production-a510f3a
    environment: *api-env
    networks:
      - default
      - shared-postgres
    command: sh -c "celery -A apps.api.tasks.celery_app worker -Q transcoding -c ${TRANSCODING_CONCURRENCY:-2} --loglevel=warning"
    restart: unless-stopped

  # Also consumes "default" (not just email_high/email_low): beat's
  # maintenance tasks (reap_stale_uploads, cleanup_soft_deleted,
  # sweep_orphan_s3, send_due_date_reminders) route to "default" per the
  # patch2 celery_app.py fix — lightweight/infrequent, not worth a
  # dedicated consumer. Without "default" here they queue forever unread,
  # same bug the patch fixed on the producer side.
  email_worker:
    image: 418837801842.dkr.ecr.eu-north-1.amazonaws.com/freeframe/api:production-a510f3a
    environment: *api-env
    networks:
      - default
      - shared-postgres
    command: sh -c "celery -A apps.api.tasks.celery_app worker -Q email_high,email_low,default -c ${EMAIL_CONCURRENCY:-2} --loglevel=warning"
    restart: unless-stopped

  beat:
    image: 418837801842.dkr.ecr.eu-north-1.amazonaws.com/freeframe/api:production-a510f3a
    environment: *api-env
    networks:
      - default
      - shared-postgres
    command: sh -c "celery -A apps.api.tasks.celery_app beat --loglevel=warning -s /tmp/celerybeat-schedule"
    restart: unless-stopped

  # NEXT_PUBLIC_API_URL is baked in at build time (image built with
  # --build-arg NEXT_PUBLIC_API_URL=https://api.freeframe.mkt.techvzero.com),
  # not read at runtime — Next.js NEXT_PUBLIC_* vars aren't dynamic.
  web:
    image: 418837801842.dkr.ecr.eu-north-1.amazonaws.com/freeframe/web:production-a510f3a
    environment:
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "18081:3000"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

networks:
  default: {}
  shared-postgres:
    external: true
    name: coolify
